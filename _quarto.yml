project:
  type: "website"
  title: "Theoretical and Empirical Research Methodology (Fall 2026)"
  output-dir: _site
  render:
    - "index.qmd"
    - "content/*.qmd"
    - "content/lecture/*.qmd"
    - "content/lecture/*/*.qmd"
    # Lecture decks are NOT built into the site: a deck must not reach the
    # students before its lecture has been held, and everything in _site/ is
    # uploaded by `quarto publish netlify`. After a lecture, add that deck
    # back here by name (and uncomment the embed block on its session page).
    - "!content/lecture/slides/*.qmd"
    # Embargo lifted after the lecture was held:
    - "content/lecture/slides/RM26_L02_AITools.qmd"
    - "content/material/*.qmd"
    - "content/material/session*/*.qmd"
    # Only decks that have been reviewed are built. The remaining decks in
    # content/material/slides/ stay unrendered (and therefore unreachable)
    # until they are checked; add them here one by one.
    - "content/material/slides/E1-Introduction.qmd"
    - "content/exercises/*.qmd"
    - "content/exercises/*/*.qmd"
    - "content/statrecap/*.qmd"
    - "content/statrecap/*/*.qmd"
  # solution.html in the dataprep-vis exercise is a pre-rendered document that
  # Quarto does not parse, so its supporting folder has to be declared by hand -
  # otherwise the page is served unstyled and without figures.
  resources:
    - "content/exercises/dataprep-vis/solution/solution_files/**"

website:
  title: "Theoretical and Empirical Research Methodology" # Title of website shown on top left
  page-navigation: true
  reader-mode: true
  open-graph: true
  favicon: "figures/icons/course_favicon.png"
  search:
    location: navbar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1 # start with "📖 Lecture" and "💻 Implementation Lab" folded
    contents:
      - href: index.qmd
