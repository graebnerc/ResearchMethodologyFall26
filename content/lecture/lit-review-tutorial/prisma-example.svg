<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-label="PRISMA 2020 flow diagram for the tutorial example, illustrative numbers: 380 records identified and screened, 300 excluded; 80 reports sought, 4 not retrieved; 76 assessed, 52 excluded with reasons; 7 studies from snowballing; 31 studies included">
  <title>PRISMA 2020 flow diagram, tutorial example (illustrative numbers)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00395B"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#FFFFFF"/>
  <g font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="21" fill="#00395B">
    <g font-weight="700" fill="#FFFFFF">
      <rect x="0" y="20"  width="44" height="120" fill="#00395B"/>
      <rect x="0" y="160" width="44" height="300" fill="#00395B"/>
      <rect x="0" y="480" width="44" height="140" fill="#00395B"/>
      <text transform="translate(29,80) rotate(-90)"  text-anchor="middle" font-size="17">Identification</text>
      <text transform="translate(29,310) rotate(-90)" text-anchor="middle" font-size="17">Screening</text>
      <text transform="translate(29,550) rotate(-90)" text-anchor="middle" font-size="17">Included</text>
    </g>
    <g fill="#FFFFFF" stroke="#00395B" stroke-width="2">
      <rect x="70"   y="30"  width="400" height="90"/>
      <rect x="70"   y="170" width="400" height="70"/>
      <rect x="70"   y="275" width="400" height="70"/>
      <rect x="70"   y="380" width="400" height="70"/>
      <rect x="70"   y="510" width="400" height="90"/>
      <rect x="540"  y="170" width="400" height="70"/>
      <rect x="540"  y="275" width="400" height="70"/>
      <rect x="540"  y="380" width="400" height="110"/>
      <rect x="1000" y="30"  width="390" height="90"/>
    </g>
    <text x="90" y="68">Records identified</text>
    <text x="90" y="100">from OpenAlex (n = 380)</text>
    <text x="90" y="212">Records screened (n = 380)</text>
    <text x="90" y="317">Reports sought (n = 80)</text>
    <text x="90" y="422">Reports assessed (n = 76)</text>
    <text x="90" y="548" font-weight="700">Studies included in</text>
    <text x="90" y="580" font-weight="700">the synthesis (n = 31)</text>
    <text x="560" y="212">Records excluded (n = 300)</text>
    <text x="560" y="317">Reports not retrieved (n = 4)</text>
    <text x="560" y="414">Reports excluded (n = 52):</text>
    <text x="560" y="444" font-size="18" fill="#6F6F6F">not empirical 21 · no working-time</text>
    <text x="560" y="470" font-size="18" fill="#6F6F6F">reduction 18 · no outcome reported 13</text>
    <text x="1020" y="68">Studies from snowballing</text>
    <text x="1020" y="100">(other methods; n = 7)</text>
    <g stroke="#00395B" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <line x1="270" y1="120" x2="270" y2="166"/>
      <line x1="270" y1="240" x2="270" y2="271"/>
      <line x1="270" y1="345" x2="270" y2="376"/>
      <line x1="270" y1="450" x2="270" y2="506"/>
      <line x1="470" y1="205" x2="536" y2="205"/>
      <line x1="470" y1="310" x2="536" y2="310"/>
      <line x1="470" y1="415" x2="536" y2="415"/>
      <polyline points="1195,120 1195,555 474,555"/>
    </g>
  </g>
</svg>
