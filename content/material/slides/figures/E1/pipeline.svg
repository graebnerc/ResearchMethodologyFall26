<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420"
     role="img" aria-label="Data preparation, visualisation and data analysis feed into each other and together into a presentation of the insights">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5"
            markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00395B"/>
    </marker>
  </defs>

  <!-- double-headed arcs between the three stages -->
  <g fill="none" stroke="#00395B" stroke-width="5"
     marker-start="url(#ah)" marker-end="url(#ah)">
    <path d="M 180 152 C 220 78 292 44 322 44"/>
    <path d="M 578 44 C 612 44 684 78 722 152"/>
    <path d="M 288 200 L 612 200"/>
  </g>

  <!-- funnel into the presentation -->
  <g fill="none" stroke="#00395B" stroke-width="5" marker-end="url(#ah)">
    <path d="M 450 258 L 450 332"/>
  </g>

  <!-- boxes -->
  <g font-family="'Open Sans', Helvetica, Arial, sans-serif" font-size="21"
     font-weight="600" fill="#00395B" text-anchor="middle">
    <rect x="330" y="12" width="240" height="60" rx="6" fill="#EAF0F4" stroke="#00395B" stroke-width="2"/>
    <text x="450" y="49">Visualisation</text>

    <rect x="20" y="160" width="250" height="80" rx="6" fill="#EAF0F4" stroke="#00395B" stroke-width="2"/>
    <text x="145" y="192">Data preparation</text>
    <text x="145" y="220">and processing</text>

    <rect x="630" y="160" width="250" height="80" rx="6" fill="#EAF0F4" stroke="#00395B" stroke-width="2"/>
    <text x="755" y="192">Data analysis</text>
    <text x="755" y="220">and modelling</text>

    <rect x="195" y="340" width="510" height="62" rx="6" fill="#00395B"/>
    <text x="450" y="378" fill="#FFFFFF">Presentation: an overall story</text>
  </g>
</svg>
